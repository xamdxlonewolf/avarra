<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Warden's Ear</title>
<style>
  :root {
    --ink: #241c16;
    --muted: #5c5146;
    --paper: #f4ead8;
    --paper-2: #efe2cc;
    --bg: #1a1612;
    --bg-2: #241e18;
    --line: #d9cbb4;
    --leaf: #2f5a40;
    --leaf-soft: #e5f0e6;
    --wine: #6e2c38;
    --wine-soft: #f6e4e6;
    --gold: #8a5a22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--paper);
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    line-height: 1.45;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  aside {
    background: var(--bg-2);
    border-right: 1px solid #3a3128;
    padding: 1.25rem 1rem 2rem;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
  }
  aside h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 0.2rem;
  }
  aside .sub {
    color: #cbbba6;
    font-size: 0.92rem;
    margin: 0 0 1rem;
  }
  .nav-btn, .side-link {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--paper);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 0.55rem 0.65rem;
    margin: 0 0 0.25rem;
  }
  .nav-btn small, .side-link small {
    display: block;
    color: #b5a690;
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.02em;
  }

    background: #322920;
    border-color: #5a4a38;
  }
  .nav-btn.wall { color: #f0c9cf; }
  .bar {
    height: 4px;
    background: #3a3128;
    border-radius: 99px;
    margin-top: 0.35rem;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    background: #8fbf96;
  }
  main {
    padding: 1.5rem 1.4rem 3rem;
    max-width: 820px;
  }
  .sheet {
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: 1.4rem 1.35rem 1.2rem;
    box-shadow: 0 18px 50px rgba(0,0,0,0.28);
  }
  .kicker {
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.4rem;
  }
  h2 { margin: 0 0 0.6rem; font-size: 1.7rem; line-height: 1.2; }

    color: var(--muted);
    margin: 0 0 0.8rem;
  }
  .prompt { font-size: 1.22rem; margin: 0 0 1rem; }
  .say, .miss, .hold, .breath {
    border-radius: 10px;
    padding: 0.85rem 0.9rem;
    margin: 0.7rem 0;
  }
  .say { background: var(--leaf-soft); }
  .miss { background: #f7f1e4; border: 1px solid var(--line); }
  .hold { background: var(--wine-soft); }
  .breath { background: #f7f3ea; border: 1px solid var(--line); }
  .label {
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin: 0 0 0.35rem;
    color: var(--muted);
  }
  .say .label { color: var(--leaf); }
  .hold .label { color: var(--wine); }
  .home {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0.4rem 0 0;
  }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
  .btn {
    border-radius: 999px;
    border: 1px solid #c8b79a;
    background: #fffaf2;
    color: var(--ink);
    padding: 0.55rem 0.95rem;
  }
  .btn.primary { background: var(--leaf); color: #f4fff5; border-color: var(--leaf); }
  .btn.ghost { background: transparent; }
  .btn.warn { background: var(--wine); color: #fff7f8; border-color: var(--wine); }
  .pocket li { margin: 0.45rem 0; }
  .score {
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 0.85rem;
    color: #d9cbb6;
    margin: 0.8rem 0 0;
  }
  .keys {
    margin-top: 1.2rem;
    color: #b5a690;
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 0.78rem;
  }
  .wall-banner {
    background: var(--wine);
    color: #fff7f8;
    border-radius: 10px;
    padding: 0.55rem 0.75rem;
    margin: 0 0 0.8rem;
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 0.85rem;
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    aside { position: relative; height: auto; border-right: 0; border-bottom: 1px solid #3a3128; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>The Warden's Ear</h1>
    <p class="sub">Say it, then look. The vault wins if a line here is wrong.</p>
    <button class="side-link" id="go-home" type="button">Tonight's twelve<small>The sentences to have cold</small></button>
    <div id="sitting-nav"></div>
    <p class="score" id="score"></p>
    <button class="side-link" id="clear-marks" type="button">Clear marks<small>Start the drill over</small></button>
    <div class="keys">Space reveals. H means you had it. N means you needed the card. Arrows move.</div>
  </aside>
  <main>
    <div class="sheet" id="sheet"></div>
  </main>
</div>
<script>
const STUDY = {
  pocket: [
    "The people other stories call monsters live here as neighbours, with a job the town needs and an upkeep they meet.",
    "Kind is the body you are born with. Condition is what you become. Both are true at once.",
    "At ten, a coloured leaf Gives a Condition. A hug with no colour Keeps the child.",
    "A death, an oath, or a survivable near-death can Strike someone later. That day has no leaf.",
    "Over a life the split runs about sixty Given, fifteen Struck, and twenty-five Kept.",
    "The Tithe is that upkeep. Meet it and you stand in good credit with the town. Fall behind and a small edge shows. The will stays yours.",
    "The Leaf-Mother is a belief some people hold. The rite is what everyone shares.",
    "Town life is late-medieval. The further step is paid for by someone's Tithe. There is no printing press and no gunpowder.",
    "It is Cut-year 387. Town Trees are living grafts of the one Tree, Thaeloren. The planting is still arriving on Heskoren. Kumbaan never took a graft.",
    "Fifteen powers stand on three continents. Kumbaan is a people at a table, behind a storm-wall.",
    "A traveler is vouched by a word: name, last hearth, who stands. Two will do.",
    "The opening sits at Harrow's Green, a grove-town on that live edge, in Hale-month of Cut-year 387."
  ],
  sittings: [
    {
      id: "square",
      title: "The square",
      kicker: "Before anyone has a sheet",
      breath: "Neighbours with a job and an upkeep. Born a Kind, become a Condition, both at once. At ten a colour Gives or a hug Keeps. Later a door can Strike. The Mother is a belief. Towns are late-medieval, and the extra is paid by a Tithe. Cut-year 387. The grafts are still moving on Heskoren, and they never reached Kumbaan. We can start at Harrow's Green.",
      cards: [
        {
          id: "sell",
          who: "A friend who has never heard of this",
          prompt: "What is this game, in the time it takes to set down a cup?",
          say: "People who would be monsters in another story live here in the open, with work the town already depends on. Each of them carries an upkeep. Meet it and the day is ordinary. Fall behind and a real edge shows. The person stays in charge of what they do. The towns look late-medieval. Anything past that was paid for by someone's upkeep.",
          miss: "A secret underclass of vampires hiding from hunters.",
          home: "The Premise"
        },
        {
          id: "everyone",
          who: "The same friend",
          prompt: "So everyone is a vampire or a werewolf?",
          say: "What you are born is your Kind: human, elf, fox-born, and the rest. What you become, if you become, is a Condition. About three in four people acquire one over a life. About one in four is hugged by the Tree and left as they are. Those are the Kept. The two layers sit on the same person. A fox-born can carry a wolf's second body. A human can die and get back up to finish a thing.",
          miss: "Monster is the species, and human is the alternative.",
          home: "The Premise"
        },
        {
          id: "when",
          who: "A parent on the square",
          prompt: "When does it happen to a child?",
          say: "In the tenth year, during Turning-Week, under the town Tree. A coloured leaf Gives a Condition, and the colour names which one. A hug of ordinary green, with no naming colour, Keeps the child, and the town wanted that. Some becomings cannot happen to a child. Those come later, when a person dies, swears a contract, or survives a drowning, a gaze, or being lost in the wild. That later change is being Struck. There is no ceremony.",
          miss: "Anyone can catch it, any year, the way a curse spreads.",
          home: "Turning Tree"
        },
        {
          id: "god",
          who: "Someone who wants the cosmology settled before they play",
          prompt: "Is the Leaf-Mother real?",
          say: "People here do not agree, and play is better if session zero does not hand down a verdict. Some say she chooses the gifts and the Trees are her hands. Others say this is simply what the Trees do. Everyone still stands the child under the canopy. The rite binds. The belief is the argument.",
          hold: "Your private answer is in the sitting called After they go home. She is real, benevolent, bounded, and costly. You do not lead with that.",
          home: "The Leaf-Mother"
        },
        {
          id: "magic",
          who: "A player who wants to know the tech level",
          prompt: "How magical is daily life?",
          say: "Chartered towns, guild halls, markets, mills, letters of credit, universities. No printing press. No gunpowder. The step past that life comes from Condition-labor, and you can see whose upkeep bought it. A deathless notary is why a house remembers three centuries. A voice that carries is why a warning crosses a storm. Where those people are scarce, that step is scarce too.",
          miss: "Wizards and magic items as the engine of the setting.",
          home: "The Premise"
        },
        {
          id: "year",
          who: "Someone looking at a blank map",
          prompt: "Where are we in history, in one breath?",
          say: "It is Cut-year 387, the Years of Hands. Most towns have their own Tree, a living cutting of the one Awakening Tree, Thaeloren, on Maiethorn. That wave filled Maiethorn, crossed the sea to Strandoren, and is still arriving on Heskoren. The storm-walled isle, Kumbaan, never took a graft. The campaign I have starts at Harrow's Green, a grove-town on that live edge, in Hale-month.",
          home: "The Ages of the Turning"
        },
        {
          id: "nations",
          who: "A player building an elf kingdom in their head",
          prompt: "Which country belongs to the elves? To the foxes?",
          say: "None. A place raises you. A Kind can be thicker on a coast, a ridge, or a dry shadow, and the town stays mixed. Faith, law, and loyalty sit on the hearth and the power, not on the body. You will meet a fox-born clerk on a priced dock and a crow-born pilgrim in a hymn-country. Both are ordinary.",
          miss: "Each ancestry owns a realm.",
          home: "Kinds of the Turning"
        },
        {
          id: "scary",
          who: "Someone who wants to know if this is horror",
          prompt: "How frightening is it, honestly?",
          say: "Mostly it is neighbours and colleagues. The fright is the upkeep when it slips: a voice that leaks what you feel, a stillness that settles in a limb, a memory that fades when you have learned nothing. I will not take your character away from you to make a monster scene. If you want a slaughter game, this is the wrong world. If you want a job, a cost, and a town that needs the job, this is it.",
          home: "At the Table"
        }
      ]
    },
    {
      id: "sort",
      title: "Sorting a person",
      kicker: "The sheet, and the mistakes on it",
      breath: "One Condition on top of a Kind. The Kept carry an empty clock and the free long rest. A missed week leaves a child unTurned. The card does not level. One Phoenix, and the table agrees. The Hollow comes after a finished contract. A Yumboe is the whole Kind, and you say yes first. Stock ancestries take a Hearth-Mark once a session.",
      cards: [
        {
          id: "born-vampire",
          who: "A player",
          prompt: "I want to be a vampire who was born a vampire.",
          say: "You were born a Kind. Long-Lived is what the Tree Gives at ten, by a deep-red leaf, and it is rare. Infernis are the people born demon-blooded. That birth is a Kind. Bound is what a person becomes by swearing a contract. An Infernis can swear, and then both are true. They do not merge into one thing.",
          miss: "Vampire and demon are ancestries you pick instead of a Condition.",
          home: "At the Table"
        },
        {
          id: "two-conditions",
          who: "A player",
          prompt: "Can I be a werewolf and a siren?",
          say: "One Condition. The Tree Gives one. A later door does not add a second. Pick the becoming. Your Kind is the other layer, and it can rhyme with the Condition without becoming it. A Selkie in the water is still a Selkie if they are also Far-Voiced.",
          home: "At the Table"
        },
        {
          id: "kept",
          who: "A player who wants no powers",
          prompt: "I don't want a Condition. What do I get instead?",
          say: "You can be Kept. The leaves hugged you. You have no Condition card and no Tithe. At every long rest you take your downtime while other people may be tending an upkeep. That empty clock is the advantage. You do not get a bonus Experience to compensate. You can still be Struck later, if you agree when a real door opens.",
          miss: "The Kept are the people the Tree rejected, so the GM owes them a feature.",
          home: "At the Table"
        },
        {
          id: "unturned",
          who: "A player writing a missed childhood",
          prompt: "My character never stood at the Tree. So they're Kept, right?",
          say: "A missed week, a refusal, or a week under unsound wood leaves a child unTurned. The Kept are the children a sound Tree hugged, and someone witnessed the hug. Folk may use the kind word. The law files the hug. An unTurned person can still be Struck later. There is no second tenth year.",
          home: "Turning Tree"
        },
        {
          id: "level",
          who: "A player looking at levels 1 through 10",
          prompt: "Does my Condition get stronger as I level?",
          say: "The card you take is the card you keep. Class features, domain cards, Experiences, weapon tier, Proficiency, and Hope scars change around it. A Two-Bodied may hang an animal Experience on the other self. A second signature for that animal is a once-ever story, not a level. Proficiency is what raises the dice the card already has.",
          home: "Conditions"
        },
        {
          id: "phoenix-seat",
          who: "A player, excited",
          prompt: "I want to be the Phoenix.",
          say: "There is one living Phoenix. The leaf is white-fire, and almost no town has seen it fall. It is a spotlight seat. The rest of the table agrees, or we keep the Phoenix as someone you meet. A hidden Phoenix is a separate conversation, after the pitch, with its own rules. I will not put two Gifts in the party.",
          hold: "Apparent two is leftover fire beside a new leaf. A remnant is not a Phoenix. Say none of that unless you have opened A Hidden Phoenix with them.",
          home: "Phoenix"
        },
        {
          id: "hollow-start",
          who: "A player",
          prompt: "Can I start as the Hollow?",
          say: "The Unbound is what a Bound becomes when a term-limited contract ends and the price is collected. You can start there if we agree you already lived the contract: what you swore, what you pledged, and the day it came due. It is not a tenth Condition you pick off the list.",
          home: "The Unbound"
        },
        {
          id: "yumboe",
          who: "A player",
          prompt: "I want to be a Yumboe. Maybe half.",
          say: "Yumboes are ordinary on Kumbaan and a story on the mainland. I have to agree before one sits at this table, and you take the whole Kind. The isle has no Leaf-Fall, so a Yumboe is not Given a Condition. A Struck Condition can still happen there, and it is rare.",
          home: "Yumboe"
        },
        {
          id: "hearth-mark",
          who: "A player with a stock ancestry",
          prompt: "A human feels thinner than a fox. Do I just accept that?",
          say: "The four customs carry three features. If both of your ancestry features come from stock, you take a Hearth-Mark: a place-phrase for where you were raised. Once a session, on a roll that place taught you, you add +2. You do not spend Hope for it. If you take any custom feature, you skip the Mark. Everyone still chooses a Community. The Mark is not a Community and not a Kind.",
          home: "Kind Heritage"
        },
        {
          id: "mixed",
          who: "A player",
          prompt: "Can I mix ancestries?",
          say: "Yes, the way Daggerheart already allows: a top and a bottom. You do not mix a custom Kind's third feature into a stock body. Any custom feature means no Hearth-Mark. A Yumboe is the full Kind, with my leave, and is not a mix.",
          home: "Kind Heritage"
        }
      ]
    },
    {
      id: "week",
      title: "Turning-Week",
      kicker: "You are the person they ask",
      breath: "One week in the tenth year. A colour or a hug under sound wood happens once. A miss, a refusal, or unsound wood leaves the child unTurned. You may correct the Speaking. You may not rerun the fall. A city remembers a hearth. The Tree Gives or Keeps. Struck happens somewhere else.",
      cards: [
        {
          id: "colours",
          who: "A parent",
          prompt: "What do the colours mean? Say them so I could stand in the square and know.",
          say: "Deep red, wine-dark: Long-Lived. Storm-grey: Two-Bodied. Lamp-amber or brass: the Answered, and the shade names Ember, Tide, Root, or Gale. Sea-blue: Far-Voiced. Pale stone, marble-white: the Stilled, and the warden says it carefully. Copper-green, the metallic one: the Taken-In. White-fire, opal: Phoenix, and a town warden sends word rather than guessing. The hug is ordinary summer green, with no naming colour. Returned, Bound, and the Unbound have no colour. The Tree never Strikes.",
          home: "Turning Tree"
        },
        {
          id: "wrong-green",
          who: "A grandparent",
          prompt: "The warden said copper-green. I saw a hug. Can we stand the child again?",
          say: "You can correct a Speaking. The Wrong Green, Cut-year 248, is the cited year a hug was Spoken as copper-green. It was a human wound. A completed standing under sound wood happens once. The wood has never answered a second fall.",
          home: "The Wrong Green"
        },
        {
          id: "sick-tree",
          who: "A family under a failing canopy",
          prompt: "The Tree was sick all week. Does that make the child Kept?",
          say: "A week spent under unsound wood leaves the child unTurned. The Kept are a witnessed hug under sound wood. Struck remains the mercy that can still come later. You do not offer next year's Leaf-Fall to sort them.",
          home: "Turning Tree"
        },
        {
          id: "city",
          who: "A player whose character is from Orentel",
          prompt: "A city can't remember every child. So they keep a register of gifts?",
          say: "They stand by hearth, in named hours. The sentence that counts is 'I am of the third quay,' not 'I am of Orentel.' The warden says the colour or the hug aloud. The gifts are not written in a roll. Threnmaieth writes the stand down. That writing is the aberration, not the custom.",
          home: "Law and Citizenship"
        },
        {
          id: "orphan",
          who: "A warden's neighbour",
          prompt: "Who brings an orphan?",
          say: "Kin first. Then the household that feeds the child. Then the warden's own house on the square. An orphan no one brings is a miss. You do not invent a second leaf because the square feels sorry.",
          home: "Turning Tree"
        },
        {
          id: "adult",
          who: "A player",
          prompt: "My character is thirty and never Turned. Can they stand this year?",
          say: "The Given door is one week in the tenth year. An adult who missed it is unTurned. A real later door can still Strike them, if they agree to the card. There is no makeup ceremony.",
          home: "At the Table"
        },
        {
          id: "white-fire",
          who: "A town that thinks it saw opal",
          prompt: "White-fire in our square. Do I announce a Phoenix?",
          say: "You send word to the First Seat. A town warden does not guess Phoenix into the record. Naming it aloud at the ceremony is how a square makes a problem it cannot hold.",
          home: "Turning Tree"
        }
      ]
    },
    {
      id: "jobs",
      title: "The jobs",
      kicker: "The old tale, then the neighbour",
      breath: "Given only: Long-Lived, Two-Bodied, the Answered, Phoenix. Struck only: Returned, Bound, and the Hollow after a finished contract. Both paths: Far-Voiced, the Stilled, the Taken-In. The town keeps them because of the work. The Tithe is the edge. The will stays theirs. Two-Bodied is the common one. Phoenix is the story.",
      cards: [
        {
          id: "long-lived",
          who: "A player",
          prompt: "I want the vampire.",
          say: "That is the Long-Lived. Given only, about two and a half percent, a deep-red leaf. Aging stops. What they witness, they can keep. They staff archives, courts, and notaries, because learning is how they stay well. Starve them of anything new and they fade, then empty. They can have children. Most children do not inherit. Violence, accident, or a failed upkeep can still end them. They wait to be asked across a threshold. People treat that as old manners, and they do not remember it as anything else.",
          home: "Long-Lived"
        },
        {
          id: "two-bodied",
          who: "A player",
          prompt: "I want the werewolf.",
          say: "That is the Two-Bodied. Given only, about eighteen percent, storm-grey, the common Condition. They carry a second animal self, a real animal between a housecat and a bear, horse, or boar, and the change is theirs to command. The animal has a name and a mood. The person chooses the actions. Towns use them for rescue, labor, war, and the wild. A full day without the other self, and the next roll with Fear shifts them. They mark a Stress. They stay in command. A roc is a story. A kelpie is a story. Neither is a body anyone carries.",
          home: "Two-Bodied"
        },
        {
          id: "returned",
          who: "A player",
          prompt: "I want the zombie.",
          say: "That is the Returned. Struck only, after a death, about seven percent, no leaf. An unfinished purpose keeps them walking. Towns send them where the work kills the living, and they tend the dead. Skip the purpose for a rest and their touch runs cold. They do not get the death option called Avoid Death. They can Refuse to Fall until the Hope scars run out. When the purpose is finished they may lie down, become Kept, or name a new purpose.",
          home: "Returned"
        },
        {
          id: "bound",
          who: "A player",
          prompt: "I want the demon.",
          say: "The demon, here, is a contract. Bound is Struck only, about five percent on that whole lane, and a child cannot swear it. They chose the power and the Terms. Towns fear them and use them wherever a word must hold. Break a Term and the contract collects. The person still chooses every action. A contract that grants true flight shows: wings they cannot hide. Signing yourself away until the table should stop playing you is called the Given-Over. We do not start there.",
          home: "Bound"
        },
        {
          id: "hollow",
          who: "A player who heard 'hollow'",
          prompt: "What is the Hollow, if it isn't a demon anymore?",
          say: "Inside that contract lane, about one and a half percent have already finished a term. The counterparty took the Pledge they named at signing. They are free, and missing that piece. The missing place is also a narrow immunity. They stay steady by resting with someone who knows their name. When the quiet runs out, an offer of power sounds reasonable. They can refuse. Refusing aches.",
          home: "The Unbound"
        },
        {
          id: "far-voiced",
          who: "A player",
          prompt: "I want the siren.",
          say: "That is the Far-Voiced. Both paths, about twelve percent, mostly Given by a sea-blue leaf. The voice carries as far as they mean it, and as truly. Relays, courts, and halls run on that. A Struck Far-Voiced actually drowned and came up untrained. The danger lands on them. Feeling they do not vent becomes a Cry, and everyone in earshot feels it. Those people still choose what they do.",
          home: "Far-Voiced"
        },
        {
          id: "stilled",
          who: "A player",
          prompt: "I want the gorgon.",
          say: "That is the Stilled. Both paths, about seven percent, a pale-stone leaf. The Gaze can hold a wound, a patient, or a fight. Guilds license it because the same look can lock a person still. If they do not keep moving, the stillness settles into their own body. A Struck one survived being turned to stone. The ticket names the Gaze, the use, not the existence of the person.",
          home: "The Stilled"
        },
        {
          id: "answered",
          who: "A player",
          prompt: "I want the genie.",
          say: "That is the Answered. Given only, about ten percent, a lamp-amber leaf. One element answered and keeps answering: Ember, Tide, Root, or Gale. The craft guilds are built on that. They ask the element. They do not take orders for it from someone else. Leave them idle too long and the element speaks through their hands and the ground around them. Other people keep their will.",
          home: "The Answered"
        },
        {

          say: "A grove-town, Harrow's Green, Hale-month, Cut-year 387. The wood there is new enough that a week can still go wrong in public. We will find out how by playing the week. I am not going to spoil it in the pitch.",
          hold: "Remnant-walker, Rosire, one Gift shared between Taeren and a PC seat. Pourer and Walled-Book heir stay offstage. No reveal that she is real.",
          home: "The Opening"
        },
        {
          id: "horror",
          who: "Someone choosing a table",
          prompt: "Is this horror, politics, or a travel game?",
          say: "It is a town game that can travel. The politics are real because the gifts are useful and people built unfair houses on top of them. The horror is a small dial. You will know your neighbours. You will also know the one upkeep that can ruin a week.",
          home: "The Premise"
        },
        {
          id: "ask",
          who: "You, when they go quiet",
          prompt: "Stop talking. Ask them the question that teaches the engine.",
          say: "Do you want to have been chosen at ten, hugged and left as you are, or changed later by something that happened to you? And what were you born as, before any of that?",
          home: "At the Table"
        }
      ]
    }
  ]
};

const STORAGE = "wardens-ear-v1";
const state = {
  view: "home",
  sitting: 0,
  card: 0,
  revealed: false,
  progress: load()
};

function load() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE)) || {};
  } catch (e) {
    return {};
  }
}
function save() {
  localStorage.setItem(STORAGE, JSON.stringify(state.progress));
  renderScore();
}
function keyOf(sittingId, cardId) {
  return sittingId + ":" + cardId;
}
function mark(sittingId, cardId, value) {
  state.progress[keyOf(sittingId, cardId)] = value;
  save();
}
function status(sittingId, cardId) {
  return state.progress[keyOf(sittingId, cardId)] || "";
}
function sittingStats(sitting) {
  let had = 0;
  sitting.cards.forEach(function (card) {
    if (status(sitting.id, card.id) === "had") had += 1;
  });
  return { had: had, total: sitting.cards.length };
}
function renderScore() {
  let had = 0;
  let total = 0;
  STUDY.sittings.forEach(function (sitting) {
    const stats = sittingStats(sitting);
    had += stats.had;
    total += stats.total;
  });
  document.getElementById("score").textContent = had + " cold of " + total;
}
function renderNav() {
  const nav = document.getElementById("sitting-nav");
  nav.innerHTML = "";
  STUDY.sittings.forEach(function (sitting, index) {
    const stats = sittingStats(sitting);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "nav-btn" + (sitting.wall ? " wall" : "") + (state.view !== "home" && state.sitting === index ? " on" : "");
    button.innerHTML = sitting.title + "<small>" + stats.had + " / " + stats.total + " cold</small><div class='bar'><span style='width:" + Math.round(100 * stats.had / stats.total) + "%'></span></div>";
    button.addEventListener("click", function () {
      openSitting(index);
    });
    nav.appendChild(button);
  });
  document.getElementById("go-home").classList.toggle("on", state.view === "home");
}
function openHome() {
  state.view = "home";
  state.revealed = false;
  render();
}
function openSitting(index) {
  state.view = "sitting";
  state.sitting = index;
  state.card = 0;
  state.revealed = false;
  render();
}
function current() {
  return STUDY.sittings[state.sitting];
}
function render() {
  renderNav();
  renderScore();
  if (state.view === "home") renderHome();
  else if (state.view === "breath") showBreath();
  else renderCard();
}
function renderHome() {
  const sheet = document.getElementById("sheet");
  const items = STUDY.pocket.map(function (line) {
    return "<li>" + escapeHtml(line) + "</li>";
  }).join("");
  sheet.innerHTML =
    "<p class='kicker'>If the pitch is tonight</p>" +
    "<h2>Twelve sentences</h2>" +
    "<p>Say them aloud with the book closed. When one snags, open that sitting and answer the scene before you read the line under it. Mark a card cold only if the words were already yours.</p>" +
    "<ol class='pocket'>" + items + "</ol>" +
    "<div class='row'><button class='btn primary' id='start' type='button'>Start at the square</button></div>" +
    "<p class='home'>This page is a drill. The vault note is the index. If a sentence and a note disagree, the note wins.</p>";
  document.getElementById("start").addEventListener("click", function () {
    openSitting(0);
  });
}
function renderCard() {
  const sitting = current();
  const card = sitting.cards[state.card];
  const sheet = document.getElementById("sheet");
  const st = status(sitting.id, card.id);
  let body = "";
  if (sitting.wall) {
    body += "<div class='wall-banner'>This sitting is for you. Do not open it in front of players.</div>";
  }
  body += "<p class='kicker'>" + escapeHtml(sitting.kicker) + " · " + (state.card + 1) + " of " + sitting.cards.length + "</p>";
  body += "<h2>" + escapeHtml(sitting.title) + "</h2>";
  body += "<p class='who'>" + escapeHtml(card.who) + "</p>";
  body += "<p class='prompt'>" + escapeHtml(card.prompt) + "</p>";
  if (!state.revealed) {
    body += "<div class='row'><button class='btn primary' id='reveal' type='button'>I've said it</button></div>";
  } else {
    body += "<div class='say'><p class='label'>A true answer</p><p>" + escapeHtml(card.say) + "</p></div>";
    if (card.miss) body += "<div class='miss'><p class='label'>If this is what came out, say it again</p><p>" + escapeHtml(card.miss) + "</p></div>";
    if (card.hold) body += "<div class='hold'><p class='label'>Hold</p><p>" + escapeHtml(card.hold) + "</p></div>";
    body += "<p class='home'>If you stumbled, open " + escapeHtml(card.home) + ".</p>";
    body += "<div class='row'>";
    body += "<button class='btn primary' id='had' type='button'>I had it cold</button>";
    body += "<button class='btn warn' id='needed' type='button'>I needed this</button>";
    body += "</div>";
  }
  body += "<div class='row'>";
  body += "<button class='btn ghost' id='prev' type='button'>Previous</button>";
  body += "<button class='btn ghost' id='next' type='button'>Next</button>";
  if (state.card === sitting.cards.length - 1) {
    body += "<button class='btn' id='breath' type='button'>Say the sitting in one breath</button>";
  }
  body += "</div>";
  if (st) {
    body += "<p class='home'>Last time you marked this " + (st === "had" ? "cold" : "as a card you needed") + ".</p>";
  }
  sheet.innerHTML = body;
  const reveal = document.getElementById("reveal");
  if (reveal) reveal.addEventListener("click", function () { state.revealed = true; render(); });
  const had = document.getElementById("had");
  if (had) had.addEventListener("click", function () { mark(sitting.id, card.id, "had"); go(1); });
  const needed = document.getElementById("needed");
  if (needed) needed.addEventListener("click", function () { mark(sitting.id, card.id, "needed"); go(1); });
  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  const breath = document.getElementById("breath");
  if (breath) breath.addEventListener("click", showBreath);
}
function showBreath() {
  state.view = "breath";
  const sitting = current();
  const stats = sittingStats(sitting);
  const sheet = document.getElementById("sheet");
  renderNav();
  sheet.innerHTML =
    "<p class='kicker'>" + escapeHtml(sitting.title) + "</p>" +
    "<h2>In one breath</h2>" +
    "<div class='breath'><p>" + escapeHtml(sitting.breath) + "</p></div>" +
    "<p>" + stats.had + " of " + stats.total + " cold in this sitting. The ones you needed are still in the list. Say those scenes again before you call the sitting done.</p>" +
    "<div class='row'><button class='btn primary' id='back' type='button'>Back to the scenes</button></div>";
  document.getElementById("back").addEventListener("click", function () {
    state.view = "sitting";
    state.revealed = false;
    render();
  });
}
function go(step) {
  const sitting = current();
  const next = state.card + step;
  if (next < 0) return;
  if (next >= sitting.cards.length) {
    showBreath();
    return;
  }
  state.card = next;
  state.revealed = false;
  render();
}
function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
document.getElementById("go-home").addEventListener("click", openHome);
document.getElementById("clear-marks").addEventListener("click", function () {
  if (!window.confirm("Clear every cold mark in this browser?")) return;
  state.progress = {};
  save();
  render();
});
document.addEventListener("keydown", function (event) {
  const tag = (event.target && event.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (state.view === "breath") {
    if (event.key === "ArrowLeft") {
      state.view = "sitting";
      state.revealed = false;
      render();
    }
    return;
  }
  if (state.view !== "sitting") return;
  if (event.key === " " || event.code === "Space") {
    event.preventDefault();
    if (!state.revealed) {
      state.revealed = true;
      render();
    }
  } else if (event.key === "ArrowRight") {
    go(1);
  } else if (event.key === "ArrowLeft") {
    go(-1);
  } else if ((event.key === "h" || event.key === "H") && state.revealed) {
    mark(current().id, current().cards[state.card].id, "had");
    go(1);
  } else if ((event.key === "n" || event.key === "N") && state.revealed) {
    mark(current().id, current().cards[state.card].id, "needed");
    go(1);
  }
});
render();
</script>
</body>
</html>
